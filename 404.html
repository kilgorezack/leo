<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights are off in this room — Northline</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B131C">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  .nf{
    min-height:100vh;display:grid;place-items:center;text-align:center;
    background:linear-gradient(178deg,var(--night) 0%,var(--dusk) 100%);
    color:var(--paper);padding:var(--pad);
  }
  .nf-in{max-width:34ch}
  .nf svg.mark{width:56px;height:56px;margin:0 auto 26px}
  .nf .code{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5rem);letter-spacing:-.04em;line-height:1;color:var(--lamp)}
  .nf h1{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.02em;margin:14px 0 12px;color:var(--paper)}
  .nf p{color:var(--light-60);margin-bottom:30px}
</style>
</head>
<body>
  <main class="nf">
    <div class="nf-in">
      <svg class="mark" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M13 2 24 10v14H2V10L13 2Z" stroke="#F0A93C" stroke-width="1.8" stroke-linejoin="round"/>
        <rect x="10" y="15" width="6" height="9" fill="#F0A93C"/>
      </svg>
      <p class="code">404</p>
      <h1>The lights are off in this room.</h1>
      <p>The page you were after isn't here. Let's get you back to a lit one.</p>
      <a href="/" class="btn">Back to the front door
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </main>
</body>
</html>
